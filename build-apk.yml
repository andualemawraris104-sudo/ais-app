name: Build AIS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure
        run: |
          flutter create --org com.aisapp --project-name ais_app ais_app
          cd ais_app

      - name: Write pubspec.yaml
        run: |
          cat > ais_app/pubspec.yaml << 'EOF'
          name: ais_app
          description: AIS - AI Service Android App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
            flutter: '>=3.10.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.4.2
            webview_flutter_android: ^3.12.1
            connectivity_plus: ^5.0.2
            flutter_animate: ^4.3.0
            google_fonts: ^6.1.0
            shimmer: ^3.0.0
            cupertino_icons: ^1.0.6
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF

      - name: Write app source files
        run: |
          mkdir -p ais_app/lib/utils ais_app/lib/theme ais_app/lib/screens ais_app/lib/widgets

          cat > ais_app/lib/utils/app_constants.dart << 'EOF'
          class AppConstants {
            AppConstants._();
            static const String appName = 'AIS';
            static const String appFullName = 'AI Service';
            static const String appVersion = '1.0.0';
            static const String webAppUrl = 'https://ais-pre-hgnhhp2zcj6gz3py43kqxy-316615685074.europe-west2.run.app';
            static const String keyFirstLaunch = 'first_launch';
            static const Duration splashDuration = Duration(seconds: 2);
            static const String userAgent = 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36 AISApp/1.0.0';
          }
          EOF

          cat > ais_app/lib/utils/connectivity_service.dart << 'EOF'
          import 'package:connectivity_plus/connectivity_plus.dart';
          class ConnectivityService {
            static final ConnectivityService _instance = ConnectivityService._internal();
            factory ConnectivityService() => _instance;
            ConnectivityService._internal();
            final Connectivity _connectivity = Connectivity();
            Stream<List<ConnectivityResult>> get connectivityStream => _connectivity.onConnectivityChanged;
            Future<bool> get isConnected async {
              final results = await _connectivity.checkConnectivity();
              return results.any((r) => r != ConnectivityResult.none);
            }
          }
          EOF

          cat > ais_app/lib/theme/app_theme.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:google_fonts/google_fonts.dart';
          class AppTheme {
            static const Color backgroundDark = Color(0xFF0A0E27);
            static const Color backgroundCard = Color(0xFF111432);
            static const Color primaryBlue = Color(0xFF4F8EF7);
            static const Color primaryPurple = Color(0xFF7C5CFC);
            static const Color accentCyan = Color(0xFF00D4FF);
            static const Color accentGreen = Color(0xFF00E676);
            static const Color textPrimary = Color(0xFFFFFFFF);
            static const Color textSecondary = Color(0xFFB0B8D1);
            static const Color borderColor = Color(0xFF1E2547);
            static const Color errorColor = Color(0xFFFF5252);
            static const Color surfaceColor = Color(0xFF151836);
            static const LinearGradient primaryGradient = LinearGradient(
              begin: Alignment.topLeft, end: Alignment.bottomRight,
              colors: [primaryBlue, primaryPurple],
            );
            static const LinearGradient backgroundGradient = LinearGradient(
              begin: Alignment.topCenter, end: Alignment.bottomCenter,
              colors: [Color(0xFF0A0E27), Color(0xFF0D1235)],
            );
            static ThemeData get darkTheme {
              return ThemeData(
                useMaterial3: true, brightness: Brightness.dark,
                scaffoldBackgroundColor: backgroundDark,
                colorScheme: const ColorScheme.dark(
                  primary: primaryBlue, secondary: primaryPurple,
                  surface: surfaceColor, error: errorColor,
                ),
                elevatedButtonTheme: ElevatedButtonThemeData(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: primaryBlue, foregroundColor: Colors.white,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                  ),
                ),
              );
            }
          }
          EOF

          cat > ais_app/lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/splash_screen.dart';
          import 'theme/app_theme.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
            ));
            runApp(const AISApp());
          }
          class AISApp extends StatelessWidget {
            const AISApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'AIS - AI Service',
                debugShowCheckedModeBanner: false,
                theme: AppTheme.darkTheme,
                home: const SplashScreen(),
              );
            }
          }
          EOF

          cat > ais_app/lib/screens/splash_screen.dart << 'EOF'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter_animate/flutter_animate.dart';
          import 'package:google_fonts/google_fonts.dart';
          import '../theme/app_theme.dart';
          import '../utils/app_constants.dart';
          import 'home_screen.dart';
          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override State<SplashScreen> createState() => _SplashScreenState();
          }
          class _SplashScreenState extends State<SplashScreen> with TickerProviderStateMixin {
            late AnimationController _pulseController;
            @override
            void initState() {
              super.initState();
              _pulseController = AnimationController(vsync: this, duration: const Duration(milliseconds: 1500))..repeat(reverse: true);
              Timer(AppConstants.splashDuration, () {
                if (mounted) {
                  Navigator.of(context).pushReplacement(
                    PageRouteBuilder(
                      pageBuilder: (_, __, ___) => const HomeScreen(),
                      transitionDuration: const Duration(milliseconds: 600),
                      transitionsBuilder: (_, animation, __, child) => FadeTransition(opacity: animation, child: child),
                    ),
                  );
                }
              });
            }
            @override void dispose() { _pulseController.dispose(); super.dispose(); }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: AppTheme.backgroundDark,
                body: Container(
                  decoration: const BoxDecoration(gradient: AppTheme.backgroundGradient),
                  child: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        AnimatedBuilder(
                          animation: _pulseController,
                          builder: (context, _) => Transform.scale(
                            scale: 1.0 + _pulseController.value * 0.05,
                            child: Container(
                              width: 100, height: 100,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: const LinearGradient(colors: [AppTheme.primaryBlue, AppTheme.primaryPurple]),
                                boxShadow: [BoxShadow(color: AppTheme.primaryBlue.withOpacity(0.4), blurRadius: 30, spreadRadius: 5)],
                              ),
                              child: Center(child: Text('AIS', style: GoogleFonts.inter(color: Colors.white, fontSize: 32, fontWeight: FontWeight.w800))),
                            ),
                          ),
                        ).animate().scale(begin: const Offset(0.5, 0.5), duration: 800.ms, curve: Curves.elasticOut),
                        const SizedBox(height: 32),
                        ShaderMask(
                          shaderCallback: (b) => const LinearGradient(colors: [AppTheme.primaryBlue, AppTheme.accentCyan]).createShader(b),
                          child: Text('AI Service', style: GoogleFonts.inter(color: Colors.white, fontSize: 36, fontWeight: FontWeight.w800)),
                        ).animate().fadeIn(delay: 400.ms),
                        const SizedBox(height: 12),
                        Text('Powered by Advanced Intelligence', style: GoogleFonts.inter(color: AppTheme.textSecondary, fontSize: 14)).animate().fadeIn(delay: 700.ms),
                        const SizedBox(height: 48),
                        const SizedBox(width: 120, child: LinearProgressIndicator(backgroundColor: AppTheme.borderColor, valueColor: AlwaysStoppedAnimation<Color>(AppTheme.primaryBlue))),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          cat > ais_app/lib/screens/home_screen.dart << 'EOF'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import '../theme/app_theme.dart';
          import '../utils/app_constants.dart';
          import '../utils/connectivity_service.dart';
          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            late WebViewController _controller;
            bool _isLoading = true, _hasError = false, _isConnected = true, _canGoBack = false;
            int _progress = 0;
            StreamSubscription? _connSub;
            @override
            void initState() {
              super.initState();
              _connSub = ConnectivityService().connectivityStream.listen((r) {
                final c = r.any((x) => x != ConnectivityResult.none);
                if (mounted) setState(() { _isConnected = c; if (c && _hasError) _reload(); });
              });
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent(AppConstants.userAgent)
                ..setBackgroundColor(AppTheme.backgroundDark)
                ..setNavigationDelegate(NavigationDelegate(
                  onPageStarted: (_) { if (mounted) setState(() { _isLoading = true; _hasError = false; _progress = 0; }); },
                  onPageFinished: (_) async {
                    final b = await _controller.canGoBack();
                    if (mounted) setState(() { _isLoading = false; _canGoBack = b; _progress = 100; });
                  },
                  onProgress: (p) { if (mounted) setState(() => _progress = p); },
                  onWebResourceError: (_) { if (mounted) setState(() { _isLoading = false; _hasError = true; }); },
                ))
                ..loadRequest(Uri.parse(AppConstants.webAppUrl));
              if (_controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
              }
            }
            Future<void> _reload() async { setState(() { _hasError = false; _isLoading = true; }); await _controller.reload(); }
            @override void dispose() { _connSub?.cancel(); super.dispose(); }
            Future<bool> _onWillPop() async {
              if (await _controller.canGoBack()) { await _controller.goBack(); return false; }
              return await showDialog<bool>(context: context, builder: (_) => AlertDialog(
                backgroundColor: AppTheme.backgroundCard,
                title: Text('Exit App', style: GoogleFonts.inter(color: AppTheme.textPrimary)),
                content: Text('Exit AIS?', style: GoogleFonts.inter(color: AppTheme.textSecondary)),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(context, false), child: Text('Cancel', style: GoogleFonts.inter(color: AppTheme.textSecondary))),
                  ElevatedButton(onPressed: () { Navigator.pop(context, true); SystemNavigator.pop(); }, child: const Text('Exit')),
                ],
              )) ?? false;
            }
            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: _onWillPop,
                child: Scaffold(
                  backgroundColor: AppTheme.backgroundDark,
                  appBar: PreferredSize(
                    preferredSize: const Size.fromHeight(kToolbarHeight + 2),
                    child: Container(
                      decoration: const BoxDecoration(color: AppTheme.backgroundDark, border: Border(bottom: BorderSide(color: AppTheme.borderColor))),
                      child: Column(mainAxisSize: MainAxisSize.min, children: [
                        AppBar(
                          backgroundColor: Colors.transparent, elevation: 0,
                          leading: _canGoBack
                            ? IconButton(icon: const Icon(Icons.arrow_back_ios_rounded, color: AppTheme.textPrimary, size: 20), onPressed: () => _controller.goBack())
                            : Padding(padding: const EdgeInsets.all(8), child: Container(
                                decoration: const BoxDecoration(shape: BoxShape.circle, gradient: AppTheme.primaryGradient),
                                child: Center(child: Text('A', style: GoogleFonts.inter(color: Colors.white, fontSize: 16, fontWeight: FontWeight.w800))),
                              )),
                          title: Column(children: [
                            Text('AI Service', style: GoogleFonts.inter(color: AppTheme.textPrimary, fontSize: 16, fontWeight: FontWeight.w600)),
                            Text('Powered by AI', style: GoogleFonts.inter(color: AppTheme.accentCyan, fontSize: 10)),
                          ]),
                          actions: [
                            _isLoading
                              ? Padding(padding: const EdgeInsets.all(12), child: SizedBox(width: 20, height: 20, child: CircularProgressIndicator(value: _progress/100, strokeWidth: 2, backgroundColor: AppTheme.borderColor, valueColor: const AlwaysStoppedAnimation(AppTheme.primaryBlue))))
                              : IconButton(icon: const Icon(Icons.refresh_rounded, color: AppTheme.textSecondary), onPressed: _reload),
                          ],
                        ),
                        if (_isLoading) LinearProgressIndicator(value: _progress/100, backgroundColor: Colors.transparent, valueColor: const AlwaysStoppedAnimation(AppTheme.primaryBlue), minHeight: 2)
                        else const SizedBox(height: 2),
                      ]),
                    ),
                  ),
                  body: !_isConnected || _hasError
                    ? Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                        const Icon(Icons.wifi_off_rounded, color: AppTheme.errorColor, size: 64),
                        const SizedBox(height: 16),
                        Text(!_isConnected ? 'No Connection' : 'Failed to Load', style: GoogleFonts.inter(color: AppTheme.textPrimary, fontSize: 20, fontWeight: FontWeight.w700)),
                        const SizedBox(height: 24),
                        ElevatedButton.icon(onPressed: _reload, icon: const Icon(Icons.refresh_rounded), label: const Text('Try Again')),
                      ]))
                    : Stack(children: [
                        WebViewWidget(controller: _controller),
                        if (_isLoading) Container(color: AppTheme.backgroundDark, child: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                          Container(width: 72, height: 72, decoration: const BoxDecoration(shape: BoxShape.circle, gradient: AppTheme.primaryGradient), child: Center(child: Text('AIS', style: GoogleFonts.inter(color: Colors.white, fontSize: 22, fontWeight: FontWeight.w800)))),
                          const SizedBox(height: 24),
                          Text('$_progress%', style: GoogleFonts.inter(color: AppTheme.primaryBlue, fontSize: 16, fontWeight: FontWeight.w600)),
                          const SizedBox(height: 12),
                          Padding(padding: const EdgeInsets.symmetric(horizontal: 48), child: LinearProgressIndicator(value: _progress/100, backgroundColor: AppTheme.borderColor, valueColor: const AlwaysStoppedAnimation(AppTheme.primaryBlue), minHeight: 4)),
                        ]))),
                      ]),
                ),
              );
            }
          }
          EOF

      - name: Write AndroidManifest
        run: |
          cat > ais_app/android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:label="AIS"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Get dependencies
        run: cd ais_app && flutter pub get

      - name: Build APK
        run: cd ais_app && flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIS-App.apk
          path: ais_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Done
        run: |
          echo "✅ APK ready! Download from the Artifacts section below."
          ls -lh ais_app/build/app/outputs/flutter-apk/
